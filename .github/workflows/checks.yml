name: Check Nudge source (no IPA)

on:
  push:
    branches: ['checks/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS source and all feature interactions without building an app
        run: bash scripts/check-source.sh
